<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lm-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="lm-text" x1="16" y1="18" x2="48" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="0.45" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="lm-border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="lm-glow" cx="32" cy="30" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="0.65" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lm-highlight" x1="32" y1="2" x2="32" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lm-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.7"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect width="64" height="64" rx="14" fill="url(#lm-bg)"/>

  <!-- Inner radial glow -->
  <rect x="3" y="3" width="58" height="58" rx="11" fill="url(#lm-glow)"/>

  <!-- Glassy top highlight -->
  <rect x="3" y="3" width="58" height="58" rx="11" fill="url(#lm-highlight)"/>

  <!-- Shimmer border -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#lm-border)" stroke-width="1.25"/>

  <!-- Corner brackets (top-left, bottom-right) -->
  <path d="M 8 5 L 5 5 L 5 8" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 56 59 L 59 59 L 59 56" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Soft glow under letters -->
  <text x="32" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="-1.5" opacity="0.45" filter="url(#lm-soft)">LM</text>

  <!-- Main letters -->
  <text x="32" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="url(#lm-text)" text-anchor="middle" letter-spacing="-1.5">LM</text>

  <!-- Top-right accent dot with halo -->
  <circle cx="51" cy="13" r="5" fill="#38bdf8" opacity="0.22"/>
  <circle cx="51" cy="13" r="2.7" fill="#38bdf8">
    <animate attributeName="r" values="2.4;3.1;2.4" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtle data trend line (bottom) -->
  <path d="M 9 55 L 18 51 L 26 53 L 34 49 L 42 50 L 50 47" stroke="#38bdf8" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3"/>
</svg>
